services:
  publisher:
    build:
      context: ..
      dockerfile: browser-worker/Dockerfile
    init: true
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/seccomp_profile.json
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      BROWSER_GATEWAY_URL: ${BROWSER_GATEWAY_URL:?Set the project browser gateway URL}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?Inject a registered worker token using the host secret store}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
