name: Deploy GuestPost to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm ci --prefix browser-worker --ignore-scripts
      - run: npm --prefix browser-worker test
      - name: Browser editorial workflow and recovery tests
        run: |
          node browser-worker/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          npm --prefix browser-worker run test:e2e
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check and test publishing connectors
        run: |
          npm run check:edge
          npm run test:edge
          npm run test:db
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://aiolueflrpraiaqvdscp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vH-ntWE5Lo8gzVETDIRTVg_Xq6jWW7G
      - run: npm run test:ui
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
